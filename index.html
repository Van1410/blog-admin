<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="Styles/Style.css" />
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-4">Blog Admin Panel</h1>

    <!-- Add New Post Form -->
    <form id="new-post-form" class="mb-5">
      <div class="mb-3">
        <label for="post-title" class="form-label">Title</label>
        <input type="text" class="form-control" id="post-title" required />
      </div>
      <div class="mb-3">
        <label for="post-content" class="form-label">Content</label>
        <textarea class="form-control" id="post-content" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label for="post-date" class="form-label">Date Posted</label>
        <input type="date" class="form-control" id="post-date" required />
      </div>
      <button type="submit" class="btn btn-primary">Add Post</button>
    </form>

    <!-- Posts Display -->
    <section id="posts-list" aria-label="Blog posts list">
      <!-- JS will render posts here -->
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-4 mt-5">
    <p class="mb-1">© 2025 Van Hamlin. All rights reserved.</p>
    <a
      href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fvan1410.github.io%2Fblog-admin%2F"
      class="text-white text-decoration-underline me-3"
      target="_blank" rel="noopener noreferrer"
      >Nu HTML Checker</a
    >
    <a
      href="https://wave.webaim.org/report#/https://van1410.github.io/blog-admin/"
      class="text-white text-decoration-underline me-3"
      target="_blank" rel="noopener noreferrer"
      >WAVE Accessibility Tool</a
    >
    <a
      href="https://van1410.github.io/Van1410/"
      class="text-white text-decoration-underline"
      target="_blank" rel="noopener noreferrer"
      >Back to Dev Profile</a
    >
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Scripts/JavaScript.js"></script>
</body>
</html>
