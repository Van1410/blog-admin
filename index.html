<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Admin</title>

  <!-- Normalize + Bootstrap + Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="bi bi-tools"></i> Blog Admin</a>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>🛠 Manage Blog Posts</h2>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPostModal">
        <i class="bi bi-plus-lg"></i> Add Post
      </button>
    </div>

    <!-- Search Input -->
    <div class="mb-3">
      <input id="searchInput" class="form-control" type="text" placeholder="Search blog posts..." />
    </div>

    <!-- Blog Post Container -->
    <div id="admin-blog-container" class="d-grid gap-3">
    
    </div>
  </div>

  <!-- Adding Post -->
  <div class="modal fade" id="addPostModal" tabindex="-1" aria-labelledby="addPostModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addPostModalLabel">Add New Blog Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addPostForm">
            <div class="mb-3">
              <label for="postTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="postTitle" required />
            </div>
            <div class="mb-3">
              <label for="postContent" class="form-label">Post</label>
              <textarea class="form-control" id="postContent" rows="3" required></textarea>
            </div>
            <div class="mb-3">
              <label for="postDate" class="form-label">Date Posted</label>
              <input type="date" class="form-control" id="postDate" required />
            </div>
            <button type="submit" class="btn btn-success">Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notify -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="toastSuccess" class="toast align-items-center text-white bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body">
          Blog post added!
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="scripts/blog-admin.js"></script>
</body>
</html>
