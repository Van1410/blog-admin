<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Admin</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Your CSS with capital S -->
  <link rel="stylesheet" href="styles/Style.css" />
  <link
    rel="icon"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/icons/pencil-square.svg"
    type="image/svg+xml"
  />
</head>
<body>
  <div class="container pb-5">
    <h1 class="mb-4">Blog Admin</h1>

    <!-- Add New Post Form -->
    <form id="new-post-form">
      <div class="mb-3">
        <label for="post-title" class="form-label">Post Title</label>
        <input type="text" class="form-control" id="post-title" required />
      </div>

      <div class="mb-3">
        <label for="post-content" class="form-label">Post Content</label>
        <textarea class="form-control" id="post-content" rows="4" required></textarea>
      </div>

      <div class="mb-3">
        <label for="post-date" class="form-label">Date</label>
        <input type="date" class="form-control" id="post-date" required />
      </div>

      <button type="submit" class="btn btn-primary">Add Post</button>
    </form>

    <!-- Dynamic Post Cards -->
    <div id="posts-list" class="mt-5"></div>
  </div>

  <!-- Footer -->
  <footer class="bg-light text-center text-muted py-3 border-top mt-5">
    <div>© Van 2025</div>
    <div>
      <a
        href="https://validator.w3.org/nu/"
        target="_blank"
        rel="noopener noreferrer"
        class="text-decoration-none me-3"
        >Nu HTML Checker</a
      >
      <a
        href="https://wave.webaim.org/"
        target="_blank"
        rel="noopener noreferrer"
        class="text-decoration-none me-3"
        >WAVE Accessibility Tool</a
      >
      <a
        href="https://van1410.github.io/Van1410/"
        target="_blank"
        rel="noopener noreferrer"
        class="text-decoration-none"
        >Back to Dev Profile</a
      >
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="scripts/admin.js"></script>
</body>
</html>
