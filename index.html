<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Admin - Van Hamlin</title>

  <!-- Normalize + Bootstrap + Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <!-- Top Navbar -->
  <nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="bi bi-clipboard-fill"></i> Blog Admin</a>
      <a href="https://van1410.github.io/Van1410/" target="_blank" class="btn btn-outline-primary">Back to Dev Profile</a>
    </div>
  </nav>

  <!-- Main Section -->
  <main class="container mt-4">
    <h1 class="mb-4">Edit Your Blog Posts</h1>

    <!-- Add New Post Form -->
    <form id="new-post-form" class="mb-5">
      <div class="mb-3">
        <label for="post-title" class="form-label">Title</label>
        <input type="text" id="post-title" class="form-control" placeholder="Enter post title" required />
      </div>
      <div class="mb-3">
        <label for="post-content" class="form-label">Content</label>
        <textarea id="post-content" class="form-control" rows="5" placeholder="Enter post content" required></textarea>
      </div>
      <div class="mb-3">
        <label for="post-date" class="form-label">Date Posted</label>
        <input type="date" id="post-date" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary">Add Post</button>
    </form>

    <!-- Posts will be rendered here -->
    <section id="posts-list"></section>
  </main>

  <!-- Footer -->
  <footer class="bg-secondary text-center text-white py-3 mt-5">
    <p class="mb-1">&copy; 2025 Van Hamlin. All rights reserved.</p>
    <p class="mb-0">
      Accessibility Report:
      <a href="https://wave.webaim.org/report#/https://van1410.github.io/blog-admin/" 
         target="_blank" rel="noopener" class="text-white text-decoration-underline">
        WAVE
      </a> |
      HTML Validation:
      <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fvan1410.github.io%2Fblog-admin%2F"
         target="_blank" rel="noopener" class="text-white text-decoration-underline">
        W3C Nu Validator
      </a>
    </p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="scripts/blog-admin.js"></script>
</body>
</html>
