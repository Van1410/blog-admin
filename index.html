<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="Styles/Style.css" />
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-4">Blog Admin Panel</h1>

    <!-- Add New Post Form -->
    <form id="new-post-form" class="mb-5">
      <div class="mb-3">
        <label for="post-title" class="form-label">Title</label>
        <input type="text" class="form-control" id="post-title" required />
      </div>
      <div class="mb-3">
        <label for="post-content" class="form-label">Content</label>
        <textarea class="form-control" id="post-content" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label for="post-date" class="form-label">Date Posted</label>
        <input type="date" class="form-control" id="post-date" required />
      </div>
      <button type="submit" class="btn btn-primary">Add Post</button>
    </form>

    <!-- Posts Display -->
    <section id="posts-list" aria-label="Blog posts list">
      <!-- JS will render posts here -->
    </section>
  </main>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="Scripts/JavaScript.js"></script>
</body>
</html>
